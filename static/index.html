*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/20px var(--font-sans); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; padding: max(var(--space-5), env(safe-area-inset-top)) var(--space-4) var(--space-7); }
main { max-width: 960px; margin: 0 auto; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.signal { background: linear-gradient(90deg, var(--cyan), var(--magenta)); }
.label { font: 600 11px/14px var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }

header { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-5); }
.mark { width: 28px; height: 6px; border-radius: var(--radius-sm); }
h1 { margin: 0; font: 700 28px/32px var(--font-display); letter-spacing: 0.04em; text-transform: uppercase; }
.tag { font: 500 11.5px/16px var(--font-mono); letter-spacing: 0.02em; color: var(--ink-muted); }
.spacer { flex: 1; }

/* Button */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  height: var(--control-md); padding: 0 var(--space-4);
  border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: transparent; color: var(--ink);
  font: 600 11px/14px var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; cursor: pointer;
  transition: box-shadow var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.btn:hover { border-color: var(--cyan-ink); color: var(--cyan-ink); background: var(--cyan-tint); }
.btn--ghost { border-color: transparent; color: var(--ink-muted); }
.btn--sm { height: var(--control-sm); padding: 0 var(--space-3); }

/* Drop zone: the one hero panel, with the corner bracket */
#drop {
  position: relative; padding: var(--space-7) var(--space-5); text-align: center; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
#drop::before, #drop::after { content: ""; position: absolute; width: 18px; height: 18px; pointer-events: none; }
#drop::before { top: -1px; left: -1px; border-top: 2px solid var(--cyan-ink); border-left: 2px solid var(--cyan-ink); border-top-left-radius: var(--radius-lg); }
#drop::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--magenta-ink); border-right: 2px solid var(--magenta-ink); border-bottom-right-radius: var(--radius-lg); }
#drop:hover, #drop.over, #drop:focus-visible { border-color: var(--cyan-ink); background: var(--cyan-tint); }
#drop .ico { width: 20px; height: 20px; color: var(--cyan-ink); margin-bottom: var(--space-3); }
#drop strong { display: block; font: 600 16px/22px var(--font-sans); margin-bottom: var(--space-1); }
#drop small { font: 500 11.5px/16px var(--font-mono); letter-spacing: 0.02em; color: var(--ink-muted); }
#file { display: none; }

.toolbar { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin: var(--space-5) 0 var(--space-3); }
.swatch { width: var(--control-sm); height: var(--control-sm); border-radius: var(--radius-md); border: 1px solid var(--line-strong); cursor: pointer; padding: 0; transition: box-shadow var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out); }
.swatch:hover { border-color: var(--cyan-ink); }
.swatch[aria-pressed="true"] { border-color: var(--cyan-ink); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--cyan-ink); }
.sw-none { background: conic-gradient(var(--line-strong) 25%, var(--surface-raised) 0 50%, var(--line-strong) 0 75%, var(--surface-raised) 0) 0 0/10px 10px; }
.sw-white { background: #fff; }
.sw-bg { background: var(--bg); }
.sw-cyan { background: var(--cyan); }
.sw-magenta { background: var(--magenta); }

/* Result cards */
#results { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-5); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
.stage {
  position: relative; aspect-ratio: 1 / 1; display: grid; place-items: center;
  background: conic-gradient(var(--surface-raised) 25%, var(--surface-overlay) 0 50%, var(--surface-raised) 0 75%, var(--surface-overlay) 0) 0 0/16px 16px;
}
.stage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.stage.solid { background-image: none; }
.stage .status {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: var(--space-4);
  font: 500 11.5px/16px var(--font-mono); letter-spacing: 0.02em; color: var(--ink-muted); background: var(--scrim);
}
.status .glyph { display: inline-grid; place-items: center; width: 20px; height: 20px; margin-bottom: var(--space-2); border: 1px solid currentColor; border-radius: var(--radius-sm); font: 600 12px/1 var(--font-mono); }
.status.err { color: var(--danger); }
.status.live { color: var(--magenta-ink); }
.dot { width: 8px; height: 8px; margin: 0 auto var(--space-3); border-radius: var(--radius-pill); background: var(--magenta); box-shadow: var(--glow-magenta); animation: pulse 2s ease-out infinite; }
@keyframes pulse { 50% { opacity: .4; } }
.meta { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3); border-top: 1px solid var(--line); }
.meta .name { flex: 1; min-width: 0; font: 400 13px/18px var(--font-mono); color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

footer { margin-top: var(--space-6); font: 400 12.5px/18px var(--font-sans); color: var(--ink-muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <span class="mark signal" aria-hidden="true"></span>
    <h1>Background begone</h1>
    <span class="tag">transparent PNG · subjects kept</span>
    <span class="spacer"></span>
    <button class="btn btn--ghost btn--sm" id="theme" type="button" aria-label="Switch theme">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span id="theme-name">Theme</span>
    </button>
  </header>

  <div id="drop" tabindex="0" role="button" aria-label="Choose images">
    <svg class="i ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
    <strong>Drop images, paste, or click to browse</strong>
    <small>JPG · PNG · WebP · up to 15 MB each</small>
  </div>
  <input id="file" type="file" accept="image/*" multiple>

  <div class="toolbar" id="toolbar" hidden>
    <span class="label">Preview on</span>
    <button class="swatch sw-none" data-bg="" aria-pressed="true" title="Transparent" aria-label="Transparent"></button>
    <button class="swatch sw-white" data-bg="#ffffff" aria-pressed="false" title="White" aria-label="White"></button>
    <button class="swatch sw-bg" data-bg="var(--bg)" aria-pressed="false" title="Background" aria-label="Background"></button>
    <button class="swatch sw-cyan" data-bg="var(--cyan)" aria-pressed="false" title="Cyan" aria-label="Cyan"></button>
    <button class="swatch sw-magenta" data-bg="var(--magenta)" aria-pressed="false" title="Magenta" aria-label="Magenta"></button>
    <span class="spacer"></span>
    <button class="btn btn--sm" id="clear" type="button">Clear all</button>
  </div>

  <div id="results" aria-live="polite"></div>

  <footer>Preview colours are display only. Downloads are always transparent PNG.</footer>
</main>

<script>
(() => {
  const MAX_BYTES = 15 * 1024 * 1024;
  const DL_ICON = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>';
  const drop = document.getElementById('drop');
  const input = document.getElementById('file');
  const results = document.getElementById('results');
  const toolbar = document.getElementById('toolbar');
  const root = document.documentElement;
  let bg = '';
  const queue = [];
  let running = false;

  // Theme: OS preference first (handled by the tokens), then the saved choice.
  const themeName = document.getElementById('theme-name');
  const dark = window.matchMedia('(prefers-color-scheme: dark)');
  const current = () => root.dataset.theme || (dark.matches ? 'dark' : 'light');
  const showTheme = () => { themeName.textContent = current() === 'dark' ? 'Dark' : 'Light'; };
  document.getElementById('theme').addEventListener('click', () => {
    const next = current() === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (_) {}
    showTheme();
  });
  dark.addEventListener('change', showTheme);
  showTheme();

  drop.addEventListener('click', () => input.click());
  drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
  input.addEventListener('change', () => { add(input.files); input.value = ''; });
  ['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => add(e.dataTransfer.files));
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => { e.preventDefault(); if (e.target !== drop && !drop.contains(e.target)) add(e.dataTransfer.files); });
  window.addEventListener('paste', e => {
    const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
    if (files.length) add(files);
  });

  toolbar.querySelectorAll('.swatch').forEach(b => b.addEventListener('click', () => {
    bg = b.dataset.bg;
    toolbar.querySelectorAll('.swatch').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    results.querySelectorAll('.stage').forEach(applyBg);
  }));
  document.getElementById('clear').addEventListener('click', () => {
    results.querySelectorAll('img').forEach(i => { if (i.src.startsWith('blob:')) URL.revokeObjectURL(i.src); });
    results.innerHTML = ''; toolbar.hidden = true;
  });

  function applyBg(stage) {
    if (bg) { stage.classList.add('solid'); stage.style.backgroundColor = bg; }
    else { stage.classList.remove('solid'); stage.style.backgroundColor = ''; }
  }

  function add(fileList) {
    const files = [...fileList].filter(f => f.type.startsWith('image/') || /\.(jpe?g|png|webp|bmp|gif|tiff?)$/i.test(f.name));
    for (const f of files) {
      const card = makeCard(f);
      results.prepend(card.el);
      toolbar.hidden = false;
      if (f.size > MAX_BYTES) { card.fail('File over 15 MB. Use a smaller image.'); continue; }
      queue.push({ f, card });
    }
    pump();
  }

  function makeCard(file) {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `<div class="stage"><img alt=""><div class="status"><div>Queued</div></div></div>
      <div class="meta"><span class="name"></span></div>`;
    el.querySelector('.name').textContent = file.name || 'pasted image';
    const stage = el.querySelector('.stage');
    const img = stage.querySelector('img');
    const status = stage.querySelector('.status');
    const meta = el.querySelector('.meta');
    applyBg(stage);
    const srcUrl = URL.createObjectURL(file);
    img.src = srcUrl;
    return {
      el,
      working() { status.className = 'status live'; status.innerHTML = '<div><div class="dot"></div>Removing background</div>'; },
      fail(msg) {
        status.className = 'status err';
        status.innerHTML = '<div><div class="glyph">x</div><div class="msg"></div></div>';
        status.querySelector('.msg').textContent = msg;
        URL.revokeObjectURL(srcUrl);
      },
      done(blob) {
        const url = URL.createObjectURL(blob);
        URL.revokeObjectURL(srcUrl);
        img.src = url; status.remove();
        const base = (file.name || 'image').replace(/\.[^.]+$/, '').replace(/[^\w-]+/g, '_') || 'image';
        const a = document.createElement('a');
        a.className = 'btn btn--sm'; a.innerHTML = DL_ICON + 'Download PNG'; a.href = url; a.download = base + '_nobg.png';
        meta.append(a);
      }
    };
  }

  async function pump() {
    if (running) return;
    running = true;
    while (queue.length) {
      const { f, card } = queue.shift();
      card.working();
      try {
        const fd = new FormData();
        fd.append('file', f, f.name || 'pasted.png');
        const r = await fetch('/api/remove', { method: 'POST', body: fd });
        if (!r.ok) {
          let msg = 'Could not remove background (' + r.status + '). Try again.';
          try { msg = (await r.json()).detail || msg; } catch (_) {}
          card.fail(msg);
        } else {
          card.done(await r.blob());
        }
      } catch (e) {
        card.fail('Network error. Check the connection and try again.');
      }
    }
    running = false;
  }
})();
</script>
</body>
